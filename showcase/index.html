<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FF Master Motion Showcase</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a2a3a; overflow: hidden; font-family: system-ui, sans-serif; }
    #stage { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute; left: 0; right: 0; top: 18px;
      text-align: center; pointer-events: none;
      color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.65);
      font-size: clamp(14px, 2.2vw, 28px); font-weight: 700; letter-spacing: 0.02em;
    }
    #status {
      position: absolute; left: 12px; bottom: 10px;
      color: #cfe0f0; font-size: 12px; opacity: 0.85; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three.module.min.js",
      "three/addons/": "../vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="overlay">FF Master · Multi-Motion Showcase</div>
  <div id="status">Loading…</div>
  <script type="module" src="showcase.js"></script>
</body>
</html>
